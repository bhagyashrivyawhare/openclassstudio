<body>

<div class="studio-layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            OpenClass Studio
        </div>

        <button class="menu-btn active"
        onclick="showPage('dashboard',this)">
            📊 Dashboard
        </button>

        <button class="menu-btn"
        onclick="showPage('content',this)">
            🎬 Content
        </button>

        <button class="menu-btn"
        onclick="showPage('upload',this)">
            ⬆ Upload
        </button>

        <button class="menu-btn"
        onclick="showPage('live',this)">
            🔴 Go Live
        </button>

        <button class="menu-btn"
        onclick="showPage('record',this)">
            🎥 Record
        </button>

        <button class="menu-btn"
        onclick="showPage('analytics',this)">
            📈 Analytics
        </button>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <!-- Dashboard Page -->

        <section id="dashboard-page" class="page">

            <h1>Dashboard</h1>

            <div class="cards">

                <div class="card">
                    <h3>Total Videos</h3>
                    <p id="totalVideos">0</p>
                </div>

                <div class="card">
                    <h3>Total Views</h3>
                    <p id="totalViews">0</p>
                </div>

                <div class="card">
                    <h3>Live Status</h3>
                    <p id="liveStatus">Offline</p>
                </div>

            </div>

            <div id="recentUploads"></div>

        </section>

        <!-- Content Page -->

        <section
        id="content-page"
        class="page hidden">

            <h1>Content</h1>

            <div
            id="videoList"
            class="video-grid">
            </div>

        </section>

        <!-- Upload Page -->

        <section
        id="upload-page"
        class="page hidden">

            <h1>Upload Video</h1>

            <input
            type="file"
            id="videoFile"
            accept="video/*">

            <input
            type="file"
            id="thumbnailFile"
            accept="image/*">

            <input
            type="text"
            id="videoTitle"
            placeholder="Video Title">

            <textarea
            id="videoDescription"
            placeholder="Description"></textarea>

            <button
            class="primary-btn"
            onclick="uploadVideo()">
                Publish Video
            </button>

            <div id="uploadProgress"></div>

        </section>

        <!-- Live Page -->

        <section
        id="live-page"
        class="page hidden">

            <h1>Go Live</h1>

            <video
            id="livePreview"
            autoplay
            muted
            playsinline>
            </video>

            <div class="actions">

                <button onclick="startLive()">
                    Start Live
                </button>

                <button onclick="shareScreen()">
                    Share Screen
                </button>

                <button onclick="stopLive()">
                    End Live
                </button>

            </div>

        </section>

        <!-- Record Page -->

        <section
        id="record-page"
        class="page hidden">

            <h1>Record Studio</h1>

            <video
            id="recordPreview"
            autoplay
            muted>
            </video>

            <div class="actions">

                <button onclick="startRecording()">
                    Start Recording
                </button>

                <button onclick="stopRecording()">
                    Stop Recording
                </button>

            </div>

        </section>

        <!-- Analytics Page -->

        <section
        id="analytics-page"
        class="page hidden">

            <h1>Analytics</h1>

            <canvas
            id="analyticsChart">
            </canvas>

        </section>

    </main>

</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="studio.js"></script>
<link rel="stylesheet" href="studio.css">
</body>
